[project]
name = "psa-3cams-dark-bright-calibration"
version = "0.1.0"
description = "Dark/bright calibration recorded with three cameras — recording, annotation, and eye-feature extraction"
readme = "README.md"
license = {text = "All rights reserved until publication"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "cheshm>=2.5.0",
    "eye-annotation-tool==4.0.0",
    "eyelink1000plus-pupil-size-to-mm==1.1.0",
    "matplotlib>=3.10.8",
    "numpy",
    "opencv-python>=4.13.0.92",
    "pyelink[pyglet]==1.2.0",
    "pyetsimul>=4.0.0",
    "pyglet>=2.1.11,<3",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "questionary>=2.0",
    "scikit-image>=0.26.0",
    "scipy",
    "sr-research-pylink>=2.1.1145.post1",
    "syelink==2.0.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = ["ruff>=0.13.0"]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

# In-repo Python package installed editable via uv:
#   utils/  → ``from utils.X import Y`` (shared helpers used across more than one
#             workflow sub-dir). Sub-dir-only helpers stay flat in that sub-dir
#             and resolve via sys.path[0].
[tool.hatch.build.targets.wheel]
packages = ["utils"]

# pylink comes from SR Research's own package index. The recording scripts also need SWAGS, the camera
# recording software, which is not public yet and is installed separately (see README.md).
[tool.uv.sources]
sr-research-pylink = { index = "sr-research" }

[[tool.uv.index]]
name     = "sr-research"
url      = "https://pypi.sr-research.com/simple/"
explicit = true

[tool.ruff]
line-length = 119
preview     = true

# Import root, so the shared helpers and the sibling modules that resolve via sys.path[0]
# are sorted as first-party rather than as third-party packages.
src = ["."]

lint.extend-select = [
    "E",       # Pycodestyle errors (style issues)
    "W",       # Pycodestyle warnings (style issues)
    "C90",     # McCabe – complexity metric for functions
    "I",       # isort – import ordering checks
    "N",       # PEP8 Naming – naming conventions
    "D",       # Pydocstyle – docstring formatting
    "UP",      # Pyupgrade – upgrades syntax to newer Python versions
    "YTT",     # Flake8-2020 – checks for Python 2020 best practices
    "ANN",     # Flake8-annotations – enforces type annotation style
    "ASYNC",   # Flake8-async – checks async/await usage
    "S",       # Flake8-bandit – security issues
    "BLE",     # Flake8-blind-except – flags bare excepts
    "FBT",     # Flake8-boolean-trap – potential pitfalls with booleans
    "B",       # Flake8-bugbear – common bug patterns
    "A",       # Flake8-builtins – misuse of Python built-in names
    "COM",     # Flake8-commas – trailing/comma issues
    "C4",      # Flake8-comprehensions – best practices in comprehensions
    "DTZ",     # Flake8-datetimez – requires timezone-aware datetime objects
    "T10",     # Flake8-debugger – debugger statements (e.g. pdb)
    "DJ",      # Flake8-django – Django-specific conventions
    "EM",      # Flake8-errmsg – error message style
    "EXE",     # Flake8-executable – executable file checks
    "FA",      # Flake8-future-annotations – future import for annotations
    "ISC",     # Flake8-implicit-str-concat – warns on implicit string concatenation
    "ICN",     # Flake8-import-conventions – enforces conventional import aliases
    "LOG",     # Flake8-logging – proper logging usage
    "G",       # Flake8-logging-format – logging format string issues
    "INP",     # Flake8-no-pep420 – warns against non-PEP420 namespace usage
    "PIE",     # Flake8-pie – Python improvement suggestions
    "PYI",     # Flake8-pyi – checks for type stub (.pyi) consistency
    "PT",      # Flake8-pytest-style – pytest best practices
    "Q",       # Flake8-quotes – enforces quote style consistency
    "RSE",     # Flake8-raise – proper raise statement usage
    "RET",     # Flake8-return – return statement issues
    "SLF",     # Flake8-self – flags instance methods that don't use self
    "SLOT",    # Flake8-slots – suggests use of __slots__ where appropriate
    "SIM",     # Flake8-simplify – code simplification hints
    "TID",     # Flake8-tidy-imports – enforces specific import styles (e.g., no relative imports)
    "TC",      # Flake8-type-checking – proper import of typing in type checks
    "INT",     # Flake8-gettext – checks for proper internationalization usage
    "ARG",     # Flake8-unused-arguments – flags unused function arguments
    "PTH",     # Flake8-use-pathlib – encourages pathlib over os.path
    "TD",      # Flake8-todos – flags TODO comments
    "FIX",     # Flake8-fixme – flags FIXME comments
    "PGH",     # Pygrep-hooks – custom grep hooks for linting
    "PL",      # Pylint – integration with Pylint conventions
    "TRY",     # Tryceratops – try/except usage suggestions
    "FLY",     # Flynt – f-string conversion suggestions
    "NPY",     # NumPy-specific rules – ensures NumPy coding standards
    "PERF",    # Perflint – performance-related checks
    "FURB",    # Refurb – rules for code refurbishment
    "RUF",     # Ruff-specific rules – additional Ruff checks
    "PLC0415", # `import` should be at the top-level of a file
]

lint.ignore = [
    "E501",    # line too long
    "E741",    # ambiguous variable name
    "FBT003",  # boolean position value in function call
    "D203",    # one blank line required before class docstring
    "D213",    # multi-line docstring summary should start at the second line
    "S311",    # pseudo-random generators not suitable for cryptography
    "PERF401", # for loops that can be replaced by a list comprehension
    "RET504",  # variable assignments that immediately precede a return
    "FA102",   # missing `from __future__ import annotations` but uses PEP 604 union
    "COM812",  # trailing comma missing
    "TRY300",  # consider moving statement to an `else` block
    "BLE001",  # do not catch blind exception
    "PLR2004", # magic value used in comparison
    "D400",    # first line should end with a period
    "D415",    # first line should end with a period, question mark, or exclamation point
    "TID252",  # prefer absolute imports over relative imports from parent modules
    "FBT001",  # boolean-typed positional argument in function definition
    "FBT002",  # boolean default positional argument in function definition
    "PLR0915", # too many statements
    "TRY003",  # avoid specifying long messages outside the exception class
    "EM101",   # exception must not use a string literal
    "EM102",   # exception must not use an f-string literal
    "D401",    # first line of docstring should be in imperative mood
    "PLR0911", # too many return statements
    "C901",    # function too complex
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0917", # too many arguments
    "PLR0914", # too many local variables
    "INP001",  # implicit namespace package (requires __init__.py)
]

[tool.ruff.lint.per-file-ignores]
# Subprocess calls to ffmpeg/ffprobe, resolved on PATH before use, with argv built from
# a fixed flag list and paths this script generated.
"eye_images_processing/extract_eye_images.py" = ["S404", "S603"]
# Wrapper that launches eye-annotation-tool via subprocess; argv is built
# from a fixed image-glob, no user-supplied strings reach the shell.
"pupil_size_to_mm/camera/annotate_artificial_eyes.py" = ["S404", "S603"]
# Same: launches eye-annotation-tool via subprocess on the canonical project.
"eye_images_processing/annotate_eye_images.py" = ["S404", "S603"]
# Launches `syelink convert` via uv, resolved on PATH before use, with argv built from a fixed
# flag list and the ASC paths this script just wrote.
"pupil_size_to_mm/eyelink1000plus/capture_artificial_eye.py" = ["S404", "S603"]
